name: Production CI/CD

on:
  # `master` is the branch this repository actually has. Triggering only on
  # `main` would leave every commit here unchecked.
  push:
    branches: [ "master", "main", "production" ]
  pull_request:
    branches: [ "master", "main", "production" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hassal_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, bcmath, pdo_mysql, intl, zip, pcntl
        coverage: xdebug
        
    - name: Copy .env
      run: php -r "file_exists('backend/.env') || copy('backend/.env.example', 'backend/.env');"
      
    - name: Install Dependencies
      working-directory: ./backend
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
      
    - name: Generate key
      working-directory: ./backend
      run: php artisan key:generate
      
    - name: Directory Permissions
      working-directory: ./backend
      run: chmod -R 777 storage bootstrap/cache
      
    - name: Run Migrations
      working-directory: ./backend
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: hassal_test
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan migrate:fresh --seed --force
      
    - name: Execute tests (Unit and Feature tests)
      working-directory: ./backend
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: hassal_test
        DB_USERNAME: root
        DB_PASSWORD: password
      run: php artisan test

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Without this job the TypeScript client is never compiled in CI: a broken
    # screen would merge and only fail when someone runs `npm run dev`.
    - name: Install client dependencies
      run: npm ci

    - name: Typecheck client
      run: npm run lint

    - name: Build client and gateway
      run: npm run build

  build-and-push:
    needs: [test, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push production image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: user/hassal-backend:latest
        cache-from: type=registry,ref=user/hassal-backend:buildcache
        cache-to: type=registry,ref=user/hassal-backend:buildcache,mode=max
