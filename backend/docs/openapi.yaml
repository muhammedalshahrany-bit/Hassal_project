openapi: 3.1.0
info:
  title: HASSAL B2B Marketplace API Engine
  description: >
    RESTful API for the HASSAL B2B food-stuff marketplace: inventory listings from
    registered businesses, purchase requests a seller reviews, quantity holds created
    by that review, deal state machines with inspection and settlement windows, a
    double-entry ledger of what a deal recorded, and RFQ demands. The platform does
    not hold money: no payment gateway, wallet or escrow custody is implemented, and
    a deal's ESCROW_FUNDED state is a status the counterparties record, not funds the
    platform keeps.
  version: 2.0.0-production
  contact:
    name: HASSAL Engineering
    email: api@hassal.example
    url: https://hassal.example

servers:
  # `.example` is the RFC 2606 reserved domain: the deployed base URL is not
  # recorded anywhere in this repository, so no real host is claimed here.
  # What is verified is the local topology — the Vite gateway on :3000 proxies
  # `/api/*` to the Laravel server on 127.0.0.1:8000.
  - url: https://hassal.example/api/v1
    description: Placeholder for a deployed base URL (not configured in this repo)
  - url: http://localhost:3000/api/v1
    description: Local dev gateway (`npm run dev`)
  - url: http://127.0.0.1:8000/api/v1
    description: Laravel server directly (`php artisan serve`)

# Provenance: this is a hand-maintained subset of the routes declared in
# backend/routes/api.php, which remains the authoritative source. Every path
# below exists in that router; the router also exposes many paths not listed
# here. Schemas are indicative, not exhaustive.
paths:
  /health:
    get:
      summary: Health check & engine status
      responses:
        '200':
          description: Operational status

  /bootstrap:
    get:
      summary: Client initialization payload for Mobile & Web
      responses:
        '200':
          description: Bootstrap configuration, currencies, feature flags, user profile

  /auth/register:
    post:
      summary: Register user and company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                password_confirmation: { type: string, description: 'Must equal `password` (`confirmed` rule).' }
                phone: { type: string, maxLength: 20 }
                national_id: { type: string, maxLength: 30 }
                organization_name: { type: string }
                organization_type: { type: string, enum: [buyer, seller] }
                commercial_registration_number: { type: string }
                vat_number: { type: string }
      responses:
        '201':
          description: Registration successful

  /auth/login:
    post:
      summary: Authenticate user and issue Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200':
          description: Authenticated

  /marketplace/offers:
    get:
      summary: Search and filter marketplace opportunities
      parameters:
        - name: category_id
          in: query
          schema: { type: integer }
        - name: opportunity_reason
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: min_price
          in: query
          schema: { type: number }
        - name: max_price
          in: query
          schema: { type: number }
      responses:
        '200':
          description: List of active offers
    post:
      summary: Create opportunity offer (Seller)
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Offer published

  /marketplace/offers/nearby:
    get:
      summary: Geographical search using Haversine formula
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number }
        - name: longitude
          in: query
          required: true
          schema: { type: number }
        - name: radius_km
          in: query
          schema: { type: number }
          description: >
            Optional. When omitted, the platform default radius applies
            (admin-configurable setting key `matching.geo_radius_km`) and is
            capped by the configured maximum radius.
      responses:
        '200':
          description: List of nearby offers

  /purchase-requests:
    post:
      summary: Raise a purchase request against an offer (holds nothing)
      security:
        - BearerAuth: []
      parameters:
        - name: X-Organization-Id
          in: header
          required: true
          schema: { type: integer }
        - name: X-Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_id, requested_quantity]
              properties:
                offer_id: { type: integer }
                requested_quantity: { type: number }
                delivery_preference: { type: string, enum: [PICKUP, DELIVERY] }
                notes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: >
            Purchase request recorded as REQUESTED. No quantity moves: the
            seller's acceptance is what reserves stock.
        '422':
          description: >
            SELF_PURCHASE_FORBIDDEN, OFFER_NOT_TRADABLE, SELLER_NOT_TRADING,
            QUANTITY_EXCEEEDS_AVAILABLE or QUANTITY_BELOW_MIN_ORDER.
    get:
      summary: List this organization's purchase requests (either side)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated purchase requests

  /purchase-requests/{id}/accept:
    post:
      summary: Seller accepts — the atomic reservation happens here
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Request accepted and stock held for the configured `reservation.timeout`
        '422':
          description: PURCHASE_REQUEST_ACCEPT_FAILED when the shelf emptied after the ask

  /marketplace/reservations:
    get:
      summary: List active reservations held for the current buyer organization
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Paginated reservations

  /marketplace/reservations/{id}/cancel:
    post:
      summary: Release a hold back to the seller's available quantity
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Reservation released
        '422':
          description: RESERVATION_NOT_ACTIVE when the hold already ended

  /deals:
    get:
      summary: List deals
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of deals
    post:
      summary: Convert reservation to Deal
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Deal initialized

  /deals/{id}/transition:
    post:
      summary: Transition deal state
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Deal state transitioned

  /ledger/journal-entries:
    get:
      summary: List double-entry journal entries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Immutable journal entries

  /ledger/trial-balance:
    get:
      summary: Financial audit trial balance
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balanced debits and credits

  /demands:
    get:
      summary: List open RFQ demands
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of open demands
    post:
      summary: Post RFQ demand
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Demand created

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Laravel Sanctum access token issued by `POST /auth/login`. Sanctum's default
        driver stores an opaque random token (its SHA-256 hash in the database), so
        this is not a JWT and must not be decoded client-side.

    # No second scheme is documented on purpose: `POST /api-keys` only creates and
    # revokes API-key records, and no middleware accepts an API-key header as a
    # request credential yet, so it cannot be declared as an authentication scheme.
